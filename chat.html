<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MihAI Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #020617;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      height: 100%;
    }
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .sidebar {
        display: none;
      }
    }
    .sidebar {
      background: #020617;
      border-right: 1px solid #111827;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .sidebar-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .btn-primary {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #022c22;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary span.icon {
      font-size: 15px;
    }
    .chat-list {
      flex: 1;
      margin-top: 10px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .chat-item {
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
      color: #e5e7eb;
      border: 1px solid transparent;
    }
    .chat-item:hover {
      background: #020617;
      border-color: #1e293b;
    }
    .chat-item.active {
      background: #020617;
      border-color: #22c55e;
    }
    .sidebar-footer {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }
    .main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .topbar {
      height: 52px;
      border-bottom: 1px solid #111827;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #020617;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    .logo-text {
      font-size: 14px;
      font-weight: 600;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      position: relative;
    }
    .top-link {
      color: #9ca3af;
      text-decoration: none;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid #1f2937;
    }
    .theme-btn {
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: transparent;
      color: #e5e7eb;
      font-size: 12px;
      padding: 4px 9px;
      cursor: pointer;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      margin-right: 4px;
    }
    .chat-container {
      flex: 1;
      padding: 16px 16px 10px;
      overflow-y: auto;
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.15), transparent 55%),
                  radial-gradient(circle at bottom, rgba(16, 185, 129, 0.12), transparent 55%),
                  #020617;
    }
    .message {
      max-width: 70%;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .message.user {
      margin-left: auto;
      background: #1d4ed8;
    }
    .message.assistant {
      background: #020617;
      border: 1px solid #1f2937;
    }
    .input-wrap {
      border-top: 1px solid #111827;
      padding: 10px 14px 14px;
      background: #020617;
    }
    .input-shell {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2937;
      padding: 6px 8px 6px 10px;
    }
    textarea {
      border: none;
      outline: none;
      resize: none;
      flex: 1;
      background: transparent;
      color: #e5e7eb;
      font-size: 14px;
      max-height: 120px;
      min-height: 28px;
    }
    .send-btn {
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
    .hint {
      font-size: 11px;
      color: #6b7280;
    }
    body.light {
      background: #f9fafb;
      color: #020617;
    }
    body.light .sidebar {
      background: #f9fafb;
      border-right-color: #e5e7eb;
    }
    body.light .topbar {
      background: #f9fafb;
      border-bottom-color: #e5e7eb;
    }
    body.light .chat-container {
      background: #f3f4f6;
    }
    body.light .message.assistant {
      background: #ffffff;
      border-color: #e5e7eb;
    }
    body.light .message.user {
      background: #2563eb;
    }
    body.light .input-shell {
      background: #ffffff;
      border-color: #e5e7eb;
    }
    body.light .theme-btn {
      border-color: #e5e7eb;
      color: #111827;
    }
    body.light .top-link {
      border-color: #e5e7eb;
      color: #111827;
    }
    body.light .chat-item:hover {
      background: #f9fafb;
      border-color: #e5e7eb;
    }
    .assistant.error {
      border-color: #b91c1c;
      color: #fecaca;
    }

    /* delete modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }
    .modal {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 16px 18px;
      max-width: 320px;
      width: 100%;
      font-size: 14px;
    }
    .modal-buttons {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      cursor: pointer;
      font-size: 13px;
    }
    .modal-btn-danger {
      background: #b91c1c;
      border-color: #7f1d1d;
    }

    /* Dropdown menus (games + settings) */
    .menu-popover {
      position: absolute;
      right: 0;
      top: 36px;
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 6px 0;
      font-size: 12px;
      min-width: 220px;
      display: none;
      z-index: 30;
    }
    .menu-popover.open {
      display: block;
    }
    .menu-popover button {
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      background: transparent;
      border: none;
      color: #e5e7eb;
      cursor: pointer;
    }
    .menu-popover button:hover {
      background: #111827;
    }
    .settings-section {
      padding: 6px 10px;
      border-top: 1px solid #1f2937;
      margin-top: 4px;
    }
    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #9ca3af;
    }
    .settings-row label {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settings-row input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <div class="sidebar-title">MihAI chats</div>
        <div class="sidebar-sub">Saved locally in your browser.</div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <button id="newChatBtn" class="btn-primary">
            <span class="icon">➕</span>
            New chat
          </button>
          <button id="deleteChatBtn" class="theme-btn" style="font-size:12px;">
            🗑 Delete
          </button>
        </div>
      </div>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-footer">
        Tip: Press Enter to send, Shift+Enter for a new line.
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <div class="logo-dot"></div>
          <div class="logo-text">MihAI chat</div>
        </div>
        <div class="top-right">
          <span id="user-label"></span>
          <span id="status-label"><span class="status-dot"></span>ready</span>
          <button id="gamesBtn" class="theme-btn">Games 🎮</button>
          <div id="gamesMenu" class="menu-popover">
            <button data-game="wyr">Would you rather…</button>
            <button data-game="quiz">Quiz mode</button>
            <button data-game="math">Quick math</button>
          </div>
          <button id="settingsBtn" class="theme-btn">Settings</button>
          <div id="settingsMenu" class="menu-popover">
            <button data-setting="theme-dark">Dark mode</button>
            <button data-setting="theme-light">Light mode</button>
            <div class="settings-section">
              <div style="font-size:11px; color:#9ca3af; margin-bottom:4px;">
                Personality
              </div>
              <div class="settings-row">
                <label>
                  <span>Chaos</span>
                  <span id="chaosValue">2</span>
                </label>
                <input id="chaosSlider" type="range" min="0" max="4" step="1" />
              </div>
              <div class="settings-row">
                <label>
                  <span>Serious</span>
                  <span id="seriousValue">2</span>
                </label>
                <input id="seriousSlider" type="range" min="0" max="4" step="1" />
              </div>
              <div class="settings-row">
                <label>
                  <span>Helpful</span>
                  <span id="helpfulValue">2</span>
                </label>
                <input id="helpfulSlider" type="range" min="0" max="4" step="1" />
              </div>
            </div>
          </div>
          <button id="login-github-btn" class="theme-btn">Login with GitHub</button>
          <a href="/" class="top-link">← Back to home</a>
        </div>
      </header>

      <section id="chatContainer" class="chat-container"></section>

      <section class="input-wrap">
        <!-- attachment preview bar -->
        <div id="attachmentBar" style="
          display:none;
          margin-bottom:6px;
          padding:6px 8px;
          border-radius:10px;
          border:1px solid #1f2937;
          background:#020617;
          font-size:11px;
          display:flex;
          align-items:center;
          gap:8px;
        ">
          <span id="attachmentLabel"></span>
          <button id="attachmentEditBtn"
            style="border:none;background:transparent;color:#e5e7eb;
            cursor:pointer;font-size:12px;">✏️</button>
          <button id="attachmentClearBtn"
            style="border:none;background:transparent;color:#f97373;
            cursor:pointer;font-size:12px;">✕</button>
        </div>

        <div class="input-shell">
          <button id="voiceBtn" class="send-btn" style="background:#0f172a;color:#e5e7eb;font-size:14px;">🎙</button>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Talk to MihAI..."
          ></textarea>
          <button id="stopBtn" class="send-btn" style="background:#ef4444;">✕</button>
          <button id="sendBtn" class="send-btn">➤</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding:0 4px; gap:10px; flex-wrap:wrap;">
          <div style="display:flex; gap:10px;">
            <label style="font-size:11px; color:#9ca3af; cursor:pointer;">
              📎 Attach file
              <input
                id="fileInput"
                type="file"
                accept=".txt,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,image/*"
                style="display:none;"
              />
            </label>
            <label style="font-size:11px; color:#9ca3af; cursor:pointer;">
              🖼 Attach photo
              <input id="imageInput" type="file" accept="image/*" style="display:none;" />
            </label>
          </div>
          <div class="hint">
            MihAI is an expressive, slightly chaotic but kind AI friend. Keep it chill and it will, too.
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    function getUserId() {
      const ghId = localStorage.getItem("mihai_github_id");
      if (ghId) return "github-" + ghId;

      const stored = localStorage.getItem("mihai_user_id");
      if (stored) return stored;

      const anon = "anon-" + crypto.randomUUID();
      localStorage.setItem("mihai_user_id", anon);
      return anon;
    }

    let userId = getUserId();

    let chats = JSON.parse(localStorage.getItem("mihai_chats") || "{}");
    let currentChatId = null;

    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const deleteChatBtn = document.getElementById("deleteChatBtn");
    const chatList = document.getElementById("chatList");
    const loginBtn = document.getElementById("login-github-btn");
    const userLabel = document.getElementById("user-label");
    const statusLabel = document.getElementById("status-label");
    const voiceBtn = document.getElementById("voiceBtn");
    const fileInput = document.getElementById("fileInput");
    const imageInput = document.getElementById("imageInput");
    const gamesBtn = document.getElementById("gamesBtn");
    const gamesMenu = document.getElementById("gamesMenu");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsMenu = document.getElementById("settingsMenu");

    const chaosSlider = document.getElementById("chaosSlider");
    const seriousSlider = document.getElementById("seriousSlider");
    const helpfulSlider = document.getElementById("helpfulSlider");
    const chaosValue = document.getElementById("chaosValue");
    const seriousValue = document.getElementById("seriousValue");
    const helpfulValue = document.getElementById("helpfulValue");

    // attachment preview elements/state
    const attachmentBar = document.getElementById("attachmentBar");
    const attachmentLabel = document.getElementById("attachmentLabel");
    const attachmentEditBtn = document.getElementById("attachmentEditBtn");
    const attachmentClearBtn = document.getElementById("attachmentClearBtn");
    let currentAttachmentPreview = null;

    function showAttachmentPreview(info) {
      currentAttachmentPreview = info; // { kind, name, type, size }
      if (!attachmentBar || !attachmentLabel) return;
      attachmentLabel.textContent =
        (info.kind === "image" ? "📷 " : "📄 ") +
        `${info.name} (${info.type}, ${info.size} bytes)`;
      attachmentBar.style.display = "flex";
    }

    function hideAttachmentPreview() {
      currentAttachmentPreview = null;
      if (!attachmentBar) return;
      attachmentBar.style.display = "none";
    }

    if (attachmentEditBtn) {
      attachmentEditBtn.addEventListener("click", () => {
        if (currentAttachmentPreview?.kind === "image") {
          if (imageInput) imageInput.click();
        } else {
          if (fileInput) fileInput.click();
        }
      });
    }

    // UPDATED: X removes last attachment + related system messages
    if (attachmentClearBtn) {
      attachmentClearBtn.addEventListener("click", () => {
        if (!currentChatId) {
          hideAttachmentPreview();
          if (fileInput) fileInput.value = "";
          if (imageInput) imageInput.value = "";
          return;
        }

        const chat = chats[currentChatId];
        if (!chat.attachments || chat.attachments.length === 0) {
          hideAttachmentPreview();
          if (fileInput) fileInput.value = "";
          if (imageInput) imageInput.value = "";
          return;
        }

        const removed = chat.attachments.pop();

        chat.messages = chat.messages.filter((m) => {
          if (m.role !== "system") return true;
          if (typeof m.content !== "string") return true;
          return !m.content.includes(removed.name);
        });

        saveChats();
        hideAttachmentPreview();
        if (fileInput) fileInput.value = "";
        if (imageInput) imageInput.value = "";
      });
    }

    const ghLogin = localStorage.getItem("mihai_github_login");
    if (userLabel) {
      if (ghLogin) {
        userLabel.textContent = `Logged in as @${ghLogin}`;
      } else if (userId.startsWith("anon-")) {
        userLabel.textContent = "Guest session";
      } else {
        userLabel.textContent = `User: ${userId}`;
      }
    }

    if (loginBtn) {
      loginBtn.addEventListener("click", () => {
        window.location.href = "/api/login-github";
      });
    }

    function initSlider(slider, label, key) {
      if (!slider || !label) return;
      const stored = localStorage.getItem(key);
      const value = stored !== null ? stored : "2";
      slider.value = value;
      label.textContent = value;
      slider.addEventListener("input", () => {
        localStorage.setItem(key, slider.value);
        label.textContent = slider.value;
      });
    }

    initSlider(chaosSlider, chaosValue, "mihai_personality_chaos");
    initSlider(seriousSlider, seriousValue, "mihai_personality_serious");
    initSlider(helpfulSlider, helpfulValue, "mihai_personality_helpful");

    // Games dropdown
    if (gamesBtn && gamesMenu) {
      gamesBtn.addEventListener("click", () => {
        gamesMenu.classList.toggle("open");
      });

      document.addEventListener("click", (e) => {
        if (!gamesMenu.contains(e.target) && e.target !== gamesBtn) {
          gamesMenu.classList.remove("open");
        }
      });

      gamesMenu.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const game = btn.getAttribute("data-game");
        gamesMenu.classList.remove("open");
        if (game === "wyr") {
          startGameWouldYouRather();
        } else if (game === "quiz") {
          startGameQuiz();
        } else if (game === "math") {
          startGameQuickMath();
        }
      });
    }

    // Settings dropdown (theme + personality)
    if (settingsBtn && settingsMenu) {
      settingsBtn.addEventListener("click", () => {
        settingsMenu.classList.toggle("open");
      });

      document.addEventListener("click", (e) => {
        if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
          settingsMenu.classList.remove("open");
        }
      });

      settingsMenu.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const setting = btn.getAttribute("data-setting");

        if (setting === "theme-dark") {
          document.body.classList.remove("light");
          localStorage.setItem("mihai_theme", "dark");
        } else if (setting === "theme-light") {
          document.body.classList.add("light");
          localStorage.setItem("mihai_theme", "light");
        }
      });
    }

    function setStatus(text, isThinking) {
      if (!statusLabel) return;
      statusLabel.textContent = "";
      const dot = document.createElement("span");
      dot.className = "status-dot";
      dot.style.background = isThinking ? "#facc15" : "#22c55e";
      statusLabel.appendChild(dot);
      statusLabel.appendChild(document.createTextNode(isThinking ? "thinking…" : text));
    }

    function saveChats() {
      localStorage.setItem("mihai_chats", JSON.stringify(chats));
    }

    function createNewChat() {
      const id = "chat-" + crypto.randomUUID();
      chats[id] = {
        title: "New chat",
        messages: [],
        attachments: [],
      };
      currentChatId = id;
      saveChats();
      renderChats();
      renderMessages();
    }

    function renderChats() {
      chatList.innerHTML = "";
      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement("div");
        div.className = "chat-item" + (id === currentChatId ? " active" : "");
        div.textContent = chat.title;
        div.onclick = () => {
          currentChatId = id;
          renderChats();
          renderMessages();
        };
        chatList.appendChild(div);
      });
    }

    function renderMessages() {
      chatContainer.innerHTML = "";
      if (!currentChatId) return;
      chats[currentChatId].messages.forEach((msg) => {
        addMessageToUI(msg.role, msg.content);
      });
      scrollBottom();
    }

    function addMessageToUI(role, content, isError = false) {
      const div = document.createElement("div");
      div.className = "message " + role;
      if (isError && role === "assistant") {
        div.classList.add("error");
      }

      if (role === "assistant") {
        const textSpan = document.createElement("span");
        textSpan.textContent = content;

        const speakBtn = document.createElement("button");
        speakBtn.textContent = "🔊";
        speakBtn.style.marginLeft = "6px";
        speakBtn.style.border = "none";
        speakBtn.style.background = "transparent";
        speakBtn.style.cursor = "pointer";
        speakBtn.style.color = "inherit";
        speakBtn.onclick = () => speak(content);

        div.appendChild(textSpan);
        div.appendChild(speakBtn);
      } else {
        const textSpan = document.createElement("span");
        textSpan.textContent = content;
        div.appendChild(textSpan);
      }

      chatContainer.appendChild(div);
    }

    function scrollBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function buildPersonalityMessage() {
      const chaos = localStorage.getItem("mihai_personality_chaos") || "2";
      const seriousness = localStorage.getItem("mihai_personality_serious") || "2";
      const helpful = localStorage.getItem("mihai_personality_helpful") || "2";

      return {
        role: "system",
        content:
          `Personality settings for this chat -> chaos: ${chaos}/4, ` +
          `seriousness: ${seriousness}/4, helpfulness: ${helpful}/4. ` +
          `Adjust your tone and style to match these numbers.`,
      };
    }

    // File upload → /api/upload + attach to chat
    if (fileInput) {
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file || !currentChatId) return;

        try {
          const formData = new FormData();
          formData.append("file", file);

          const res = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });

          const data = await res.json();
          if (!data.ok) {
            throw new Error(data.error || "Upload failed");
          }

          const f = data.file;

          if (!chats[currentChatId].attachments) {
            chats[currentChatId].attachments = [];
          }

          chats[currentChatId].attachments.push({
            name: f.name,
            type: f.type,
            size: f.size,
          });

          chats[currentChatId].messages.push({
            role: "system",
            content:
              `User uploaded a file named "${f.name}" (type: ${f.type}, size: ${f.size} bytes). ` +
              `Ask them what they want to do with it and guide them. You cannot directly open it, ` +
              `so ask them to describe or paste relevant parts if needed.`,
          });
          saveChats();

          showAttachmentPreview({
            kind: "file",
            name: f.name,
            type: f.type,
            size: f.size,
          });

          alert("File uploaded and attached to this chat.");
        } catch (e) {
          console.error("Upload error", e);
          alert("Could not upload that file.");
        } finally {
          fileInput.value = "";
        }
      });
    }

    // Image upload → /api/vision + attach to chat with vision description
    if (imageInput) {
      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        if (!file || !currentChatId) return;

        try {
          const formData = new FormData();
          formData.append("file", file);

          const res = await fetch("/api/vision", {
            method: "POST",
            body: formData,
          });

          const data = await res.json();
          if (!data.ok) {
            throw new Error(data.error || "Vision failed");
          }

          const f = data.file || {
            name: file.name,
            type: file.type,
            size: file.size,
          };

          if (!chats[currentChatId].attachments) {
            chats[currentChatId].attachments = [];
          }

          chats[currentChatId].attachments.push({
            name: f.name,
            type: f.type,
            size: f.size,
          });

          chats[currentChatId].messages.push({
            role: "system",
            content:
              `User uploaded an image file named "${f.name}" (type: ${f.type}, size: ${f.size} bytes).`,
          });

          if (data.description) {
            chats[currentChatId].messages.push({
              role: "system",
              content:
                `Vision tool says about the uploaded image: "${data.description}". ` +
                `Use this as if you actually saw the photo when answering questions about it.`,
            });
          }

          saveChats();

          showAttachmentPreview({
            kind: "image",
            name: f.name,
            type: f.type,
            size: f.size,
          });

          alert("Photo analyzed and attached to this chat.");
        } catch (e) {
          console.error("Image upload / vision error", e);
          alert("Could not process that image.");
        } finally {
          imageInput.value = "";
        }
      });
    }

    // Voice input
    let recognition = null;
    if ("SpeechRecognition" in window || "webkitSpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = "en-US";

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        messageInput.value = transcript;
        sendMessage();
      };
    }

    if (voiceBtn) {
      voiceBtn.addEventListener("click", () => {
        if (!recognition) {
          alert("Voice recognition not supported in this browser.");
          return;
        }
        recognition.start();
      });
    }

    // TTS (toggle)
    let currentUtterance = null;

    function speak(text) {
      try {
        if (!window.speechSynthesis) return;

        if (currentUtterance && speechSynthesis.speaking) {
          speechSynthesis.cancel();
          currentUtterance = null;
          return;
        }

        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1;
        utter.pitch = 1;
        utter.onend = () => {
          currentUtterance = null;
        };
        currentUtterance = utter;
        speechSynthesis.speak(utter);
      } catch (_) {}
    }

    // Stop button: cancel typing + voice
    let currentTypingInterval = null;

    if (stopBtn) {
      stopBtn.addEventListener("click", () => {
        if (currentTypingInterval) {
          clearInterval(currentTypingInterval);
          currentTypingInterval = null;
        }
        if (window.speechSynthesis && speechSynthesis.speaking) {
          speechSynthesis.cancel();
          currentUtterance = null;
        }
        setStatus("ready", false);
      });
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      if (!currentChatId) {
        createNewChat();
      }

      messageInput.value = "";
      messageInput.style.height = "auto";

      chats[currentChatId].messages.push({
        role: "user",
        content: text,
      });
      addMessageToUI("user", text);

      const assistantDiv = document.createElement("div");
      assistantDiv.className = "message assistant";
      assistantDiv.textContent = "Thinking...";
      chatContainer.appendChild(assistantDiv);
      scrollBottom();
      setStatus("thinking…", true);

      try {
        const personalityMsg = buildPersonalityMessage();
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId,
            chatId: currentChatId,
            messages: [personalityMsg, ...chats[currentChatId].messages],
            attachments: chats[currentChatId].attachments || [],
          }),
        });

        const data = await response.json();
        const fullText = data.reply || "No reply from MihAI.";

        assistantDiv.textContent = "";
        let i = 0;
        const speed = 18;

        if (currentTypingInterval) {
          clearInterval(currentTypingInterval);
        }

        currentTypingInterval = setInterval(() => {
          if (i >= fullText.length) {
            clearInterval(currentTypingInterval);
            currentTypingInterval = null;
            return;
          }
          assistantDiv.textContent += fullText[i] || "";
          i++;
          scrollBottom();
        }, speed);

        chats[currentChatId].messages.push({
          role: "assistant",
          content: fullText,
        });

        if (
          chats[currentChatId].title === "New chat" &&
          text.trim().length > 0
        ) {
          chats[currentChatId].title = text.slice(0, 24);
        }

        saveChats();
        renderChats();
        setStatus("ready", false);
      } catch (err) {
        console.error(err);
        assistantDiv.textContent = "Error talking to MihAI.";
        assistantDiv.classList.add("error");
        setStatus("ready", false);
      }
    }

    sendBtn.onclick = sendMessage;

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = messageInput.scrollHeight + "px";
    });

    newChatBtn.onclick = createNewChat;

    function showDeleteModal() {
      if (!currentChatId) return;

      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";

      const modal = document.createElement("div");
      modal.className = "modal";
      modal.innerHTML = `
        <div>Are you sure you wanna delete this chat?<br />You can't undo it.</div>
        <div class="modal-buttons">
          <button class="modal-btn" data-action="no">No</button>
          <button class="modal-btn modal-btn-danger" data-action="yes">Yes</button>
        </div>
      `;
      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);

      backdrop.addEventListener("click", (e) => {
        const action = e.target.getAttribute("data-action");
        if (!action) {
          if (e.target === backdrop) document.body.removeChild(backdrop);
          return;
        }

        if (action === "no") {
          document.body.removeChild(backdrop);
          return;
        }

        if (action === "yes") {
          delete chats[currentChatId];
          const keys = Object.keys(chats);
          if (keys.length === 0) {
            createNewChat();
          } else {
            currentChatId = keys[0];
          }
          saveChats();
          renderChats();
          renderMessages();
          document.body.removeChild(backdrop);
        }
      });
    }

    if (deleteChatBtn) {
      deleteChatBtn.addEventListener("click", showDeleteModal);
    }

    if (localStorage.getItem("mihai_theme") === "light") {
      document.body.classList.add("light");
    }

    if (Object.keys(chats).length === 0) {
      createNewChat();
    } else {
      for (const id of Object.keys(chats)) {
        if (!chats[id].attachments) chats[id].attachments = [];
      }
      currentChatId = Object.keys(chats)[0];
      renderChats();
      renderMessages();
    }

    setStatus("ready", false);

    async function startGameWouldYouRather() {
      if (!currentChatId) {
        createNewChat();
      }

      const systemMsg =
        "Start a 'Would you rather' game with me. Ask one fun question at a time and wait for my answer each time. Keep it light and playful.";
      chats[currentChatId].messages.push({
        role: "user",
        content: systemMsg,
      });
      saveChats();

      addMessageToUI("user", "(Game) " + systemMsg);

      const assistantDiv = document.createElement("div");
      assistantDiv.className = "message assistant";
      assistantDiv.textContent = "Starting game...";
      chatContainer.appendChild(assistantDiv);
      scrollBottom();
      setStatus("thinking…", true);

      try {
        const personalityMsg = buildPersonalityMessage();
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId,
            chatId: currentChatId,
            messages: [personalityMsg, ...chats[currentChatId].messages],
            attachments: chats[currentChatId].attachments || [],
          }),
        });

        const data = await response.json();
        const fullText = data.reply || "No reply from MihAI.";

        assistantDiv.textContent = fullText;

        chats[currentChatId].messages.push({
          role: "assistant",
          content: fullText,
        });

        saveChats();
        renderChats();
        setStatus("ready", false);
      } catch (err) {
        console.error(err);
        assistantDiv.textContent = "Error starting game.";
        assistantDiv.classList.add("error");
        setStatus("ready", false);
      }
    }

      if (!currentChatId) {
        createNewChat();
      }

      const systemMsg =
        "Start a quiz game with me. Ask one question at a time. Mix topics like gaming, tech, school facts, and general knowledge. After 10 questions, tell me my score. Wait for my answer after each question.";
      chats[currentChatId].messages.push({

    async function startGameQuickMath() {
      if (!currentChatId) {
        createNewChat();
      }

      const systemMsg =
        "Start a quick math challenge with me. Ask one math problem at a time (start easy with addition and subtraction, then get harder with multiplication and maybe fractions). After each answer, tell me if I'm right and keep a small score.";
      chats[currentChatId].messages.push({
        role: "user",
        content: systemMsg,
      });
      saveChats();

      addMessageToUI("user", "(Game) " + systemMsg);

      const assistantDiv = document.createElement("div");
      assistantDiv.className = "message assistant";
      assistantDiv.textContent = "Starting quick math...";
      chatContainer.appendChild(assistantDiv);
      scrollBottom();
      setStatus("thinking…", true);

      try {
        const personalityMsg = buildPersonalityMessage();
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId,
            chatId: currentChatId,
            messages: [personalityMsg, ...chats[currentChatId].messages],
            attachments: chats[currentChatId].attachments || [],
          }),
        });

        const data = await response.json();
        const fullText = data.reply || "No reply from MihAI.";

        assistantDiv.textContent = fullText;

        chats[currentChatId].messages.push({
          role: "assistant",
          content: fullText,
        });

        saveChats();
        renderChats();
        setStatus("ready", false);
      } catch (err) {
        console.error(err);

      }
    }
  </script>
