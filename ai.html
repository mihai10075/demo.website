<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MihAI Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ai-body">
  <div class="glow-orbit"></div>

  <div class="card">
    <div class="card-inner">
      <div class="top-bar">
        <div class="top-left">
          <h1>MihAI</h1>
          <p class="tagline">Your chaotic, friendly AI companion 🤖✨</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="backBtn">&#8592;</button>
        </div>
      </div>

      <div class="section">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-form">
          <input type="text" id="userInput" placeholder="Say something..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>

      <div class="follow-section">
        <button class="follow-btn" id="celebrateBtn">🎉 Celebrate!</button>
      </div>
    </div>
  </div>

  <script src="chat-enhanced.js"></script>
</body>
</html>
